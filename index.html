<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="img/favicon/favicon.png"
      type="image/x-icon"
    />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>El Pollo Loco</h1>
    <main>
      <header style="z-index: 10">
        <div>
          <button popovertarget="infoPopover" id="infoButton"></button>
        </div>
        <div>
          <button id="soundButton"></button>
          <button id="fullscreenButton"></button>
        </div>
      </header>
      <canvas id="canvas"></canvas>
      <div class="start-screen">
        <button id="startGameButton"><span>Start Game</span></button>
        <dialog popover id="infoPopover" class="info-popover gradient-border">
          <h2>Key Bindings</h2>
          A key = Left <br />
          D key = Right <br />
          Space = Jump <br />
          F key = Throw <br />
        </dialog>
        <footer>
          <a href="impressum.html">Impressum</a>
        </footer>
      </div>
      <div id="gameEndScreen" class="d-none">
        <button id="playAgainButton"><span>Play Again</span></button>
        <button id="backToStartButton"><span>Back to Start</span></button>
      </div>
      <section class="d-none">
        <div>
          <button id="leftButton"></button>
          <button id="rightButton"></button>
        </div>
        <div>
          <button id="jumpButton"></button>
          <button id="throwButton"></button>
        </div>
      </section>
    </main>
    <dialog id="rotateScreen" class="rotate-screen"></dialog>
    <script type="module" src="./js/game.js"></script>
  </body>
</html>
