<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="img/favicon/favicon.png"
      type="image/x-icon"
    />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>El Pollo Loco</h1>
    <main>
      <header style="z-index: 10">
        <div>
          <button popovertarget="infoPopover" id="infoButton"></button>
        </div>
        <div>
          <button id="soundButton"></button>
          <button id="fullscreenButton"></button>
        </div>
      </header>
      <div class="start-screen">
        <button id="playButton"><span>Start Game</span></button>
        <dialog popover id="infoPopover" class="info-popover gradient-border">
          <h2>Tastenbelegung</h2>
          Taste A = Links <br />
          Taste D = Rechts <br />
          Leertaste = Springen <br />
          Taste F = Werfen <br />
        </dialog>
        <footer>
          <a href="impressum.html">Impressum</a>
        </footer>
      </div>
      <canvas id="canvas"></canvas>
    </main>
    <script type="module" src="./js/game.js"></script>
  </body>
</html>
