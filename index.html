<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="img/favicon/favicon.png"
      type="image/x-icon"
    />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>El Pollo Loco</h1>
    <main id="mainContainer">
      <div class="start-screen">
        <header>
          <div>
            <button popovertarget="helpPopover" id="helpButton"></button>
          </div>
          <div>
            <button id="soundButton"></button>
            <button id="fullscreenButton"></button>
          </div>
        </header>
        <dialog popover id="helpPopover" class="help-popover">
          <h2>Tastenbelegung</h2>
          Taste A = Links <br />
          Taste D = Rechts <br />
          Leertaste = Springen <br />
          Taste F = Werfen <br />
        </dialog>
        <footer>
          <a href="impressum.html">Impressum</a>
        </footer>
      </div>
      <canvas id="canvas"></canvas>
    </main>
    <script type="module" src="./js/game.js"></script>
  </body>
</html>
